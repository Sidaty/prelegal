spring.application.name=prelegal
server.port=8000

# SQLite file, rebuilt from scratch on every start (ddl-auto=create drops and recreates tables).
spring.datasource.url=jdbc:sqlite:${PRELEGAL_DB_PATH:prelegal.db}
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
